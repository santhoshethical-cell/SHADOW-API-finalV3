<!doctype html>
<html lang="en" data-theme="cyber">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set a new password · Shadow API Scanner</title>
  <link rel="stylesheet" href="/static/styles.css?v=4">
  <script defer src="/static/setpw.js?v=4"></script>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <section class="view centered">
    <div class="auth-card">
      <div class="brand"><span class="brand-mark">◇</span><h1>Set a new password</h1></div>
      <p class="muted">Your account still uses the one-time generated password.
        Choose a new one to continue.</p>
      <form id="change-form" class="stack">
        <label>New password<input id="new-password" type="password" autocomplete="new-password" required></label>
        <label>Confirm<input id="new-password2" type="password" autocomplete="new-password" required></label>
        <button class="btn primary" type="submit">Update password</button>
        <p id="change-error" class="error" hidden></p>
      </form>
    </div>
  </section>
</body>
</html>
