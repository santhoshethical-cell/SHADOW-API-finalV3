<!doctype html>
<html lang="en" data-theme="cyber">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Shadow API Scanner</title>
  <link rel="stylesheet" href="/static/styles.css?v=4">
  <script defer src="/static/login.js?v=4"></script>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <section class="view centered">
    <div class="auth-card">
      <div class="brand">
        <span class="brand-mark">◇</span>
        <div>
          <h1>Shadow&nbsp;API&nbsp;Scanner</h1>
          <p class="tagline">Unmanaged API detection &amp; security validation</p>
        </div>
      </div>
      <form id="login-form" class="stack">
        <label>Username<input id="login-username" autocomplete="username" required></label>
        <label>Password<input id="login-password" type="password" autocomplete="current-password" required></label>
        <button class="btn primary" type="submit">Sign in</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </div>
  </section>
</body>
</html>
